worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # ==========================================
    # LOAD BALANCER CONFIGURATION (BACKEND)
    # ==========================================
    upstream api_backend {
        # Load balancing algorithm. Defaults to Round Robin.
        # least_conn; # Uncomment to send request to the server with least active connections
        # ip_hash;    # Uncomment to enable sticky sessions (same IP goes to same server)
        
        server 127.0.0.1:8001;
        server 127.0.0.1:8002;
        server 127.0.0.1:8003;
        
        # Add more servers here or adjust weights
        # server 127.0.0.1:8004 weight=3;
    }

    # ==========================================
    # LOAD BALANCER CONFIGURATION (FRONTEND)
    # ==========================================
    # If you are running multiple React dev servers (e.g., port 3000, 3001)
    # You can load balance them too. Otherwise, just keep one.
    upstream frontend_servers {
        server 127.0.0.1:3000;
        # server 127.0.0.1:3001;
    }

    server {
        listen       80;
        server_name  localhost;

        # 1. Frontend Proxy (Load Balanced)
        # We proxy to the React dev server(s) running via npm start
        location / {
            proxy_pass http://frontend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade'; # Needed for React Hot-Reloading WebSockets
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Alternatively, if you want to serve the STATIC BUILD folder instead of the dev server, 
        # comment out the 'location /' block above and uncomment the block below:
        #
        # location / {
        #     root   "C:/Users/ANURAG SINGH/Downloads/AI_Powered_Certificate_Generation_And_Verification_System-main/AI_Powered_Certificate_Generation_And_Verification_System/frontend/build";
        #     index  index.html index.htm;
        #     try_files $uri $uri/ /index.html;
        # }

        # 2. Backend API Proxy (Load Balanced)
        location /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Forward real client IP to the backend
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
